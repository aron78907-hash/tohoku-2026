.box{background:var(--card);border:3px solid var(--edge);border-radius:22px;box-shadow:0 5px 0 var(--edge)}

.subt{margin:4px 0 0;color:var(--muted);font-size:14px}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0 4px}
.tools button,.tools span{font:inherit;font-size:13px;border:2px solid var(--edge);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 12px}
.tools button{cursor:pointer}
.tools b{color:var(--red)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px dashed var(--red);outline-offset:3px}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
.tabs{display:flex;gap:12px;overflow-x:auto;padding:10px 14px 14px;max-width:640px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font:inherit;text-align:left;color:var(--ink);cursor:pointer;padding:8px 14px;border-radius:18px;min-width:150px;background:var(--card);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge)}
.tab .t{display:flex;align-items:center;gap:6px;font-size:19px;font-weight:900}
.tab .t svg{width:30px;height:30px}
.tab small{display:block;color:var(--muted);font-size:13px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--yellow)}

.head{padding:16px 18px;margin:8px 0 18px}
.head .row{display:flex;gap:12px;align-items:flex-start}
.head svg{width:52px;height:52px;flex:0 0 auto}
.head h2{margin:0;font-size:24px;font-weight:900;line-height:1.35}
.head p{margin:6px 0 0;color:var(--muted)}
.cost{display:block;width:max-content;margin:10px 0 0 auto;background:var(--yellow);border:3px dashed var(--edge);border-radius:14px;padding:4px 16px;font-weight:700}
.cost small{font-weight:500;color:var(--muted);font-size:11px;display:block;text-align:right}

.mapbox{overflow:hidden;margin-bottom:18px}
.mapbox svg{display:block;width:100%;height:auto;border-bottom:3px solid var(--edge)}
.mapbox text{font-family:inherit}
.now{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;padding:16px 18px 6px}
.now .tm{font-size:40px;font-weight:900;line-height:1}
.now .tx{font-size:17px}
.ctrl{display:flex;align-items:center;gap:14px;padding:10px 18px 16px;border-bottom:3px dashed var(--muted)}
.play{width:56px;height:56px;border-radius:50%;background:var(--red);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);color:#fff;font-size:22px;cursor:pointer;flex:0 0 auto}
.ctrl input{flex:1;accent-color:var(--red)}
.spd{font:inherit;font-weight:700;background:var(--yellow);border:3px solid var(--edge);border-radius:999px;padding:4px 16px;cursor:pointer;color:var(--ink)}
.team{display:flex;flex-wrap:wrap;gap:10px;padding:14px 18px}
.team span{display:flex;align-items:center;gap:6px;border:2px solid var(--edge);border-radius:999px;padding:2px 14px 2px 4px;font-weight:700}
.team svg{width:30px;height:30px}

ol{list-style:none;margin:0;padding:6px 14px 14px}
.it{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:10px 8px;border-radius:14px;cursor:pointer}
.it.on{background:var(--yellow)}
.it time{font-weight:900;color:var(--red)}
.it strong{display:block}
.it small{display:block;color:var(--muted);font-size:13px}
.it a{font-size:12px;color:var(--green);font-weight:700}
.go{margin:0 0 0 70px;padding:2px 10px;border-left:3px dotted var(--red);font-size:13px;color:var(--muted)}
.go em{font-style:normal;background:var(--red);color:#fff;border-radius:6px;padding:0 6px;margin-left:4px}
.stay{margin:0 14px 16px;padding:8px 12px;border-radius:12px;background:var(--park);font-size:14px}
.info{padding:14px 16px;margin-bottom:18px}
.info h3{margin:0 0 8px;font-size:18px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:380px}
td,th{text-align:left;padding:6px 6px;border-bottom:2px dotted var(--muted);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:6px 0 40px}

function drawMap(m,stops,cur){
  const W=360,H=m.h||320;let s=`<rect width="${W}" height="${H}" fill="var(--land)"/>`;
  m.water.forEach(d=>s+=`<path d="${d}" fill="var(--water)"/>`);
  m.rivers.forEach(d=>s+=`<path d="${d}" fill="none" stroke="var(--water)" stroke-width="12" stroke-linecap="round"/>`);
  m.parks.forEach(([x,y,rx,ry])=>s+=`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="var(--park)"/>`);
  if(m.div)s+=`<path d="M0 ${m.div} H${W}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 6"/>`;
  [[60,70],[300,250],[180,180]].forEach(([x,y])=>s+=`<text x="${x}" y="${y}" font-size="12" fill="var(--yellow)" stroke="var(--muted)" stroke-width=".4">✦</text>`);
  s+=`<path d="M300 18 q6 -8 14 -2 q8 -4 12 4 q6 0 4 6 h-32 q-4 -6 2 -8z" fill="#fff" stroke="var(--muted)" stroke-width="1.2" opacity=".9"/>`;
  m.areas.forEach(([x,y,t])=>s+=`<text x="${x}" y="${y}" font-size="15" font-weight="900" fill="var(--muted)" opacity=".55">${t}</text>`);
  m.marks.forEach(([x,y,e,t])=>s+=`<text x="${x}" y="${y}" font-size="20" text-anchor="middle">${e}</text>${t?`<text x="${x}" y="${y+13}" font-size="9" text-anchor="middle" fill="var(--muted)">${t}</text>`:""}`);
  /* route */
  const P=m.stops;
  for(let i=1;i<P.length;i++){const [a,b]=[P[i-1],P[i]];const k=m.km[i-1];
    s+=`<path d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}" stroke="var(--ink)" stroke-width="${k?2.2:1.6}" stroke-dasharray="${k?"7 6":"3 4"}" opacity=".7"/>`;
    if(k)s+=`<g><rect x="${(a[0]+b[0])/2-30}" y="${(a[1]+b[1])/2-10}" width="60" height="18" rx="9" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/><text x="${(a[0]+b[0])/2}" y="${(a[1]+b[1])/2+3}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">約 ${k} km</text></g>`;}
  P.forEach(([x,y,e],i)=>{const it=stops[i];const name=it[1].split(/[（(→]/)[0].trim();const lab=`${it[0]} ${name.length>5?name.slice(0,5)+"…":name}`;const w=lab.length*7.2+14;const on=i===cur;
    s+=`<g class="pin" data-i="${i}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="15" fill="var(--card)" stroke="var(--ink)" stroke-width="2.2"/><text x="${x}" y="${y+6}" font-size="15" text-anchor="middle">${e}</text>
    <rect x="${x-w/2}" y="${y+18}" width="${w}" height="17" rx="8.5" fill="${on?"var(--red)":"var(--card)"}" stroke="var(--ink)" stroke-width="1.6"/><text x="${x}" y="${y+30}" font-size="10" font-weight="700" text-anchor="middle" fill="${on?"#fff":"var(--ink)"}">${esc(lab)}</text></g>`;});
  s+=`<g id="walker"><g transform="translate(-30 -44) scale(.42)">${AV1}</g><g transform="translate(-4 -40) scale(.42)">${AV2}</g></g>`;
  s+=`<g transform="translate(22 ${H-20})"><circle r="12" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/><path d="M0 -8 L4 2 H-4Z" fill="var(--red)"/><text y="9" font-size="7" text-anchor="middle" fill="var(--muted)">北</text></g>`;
  return s;}

/* tabs */
const tabs=document.getElementById("tabs");
tabs.innerHTML=`<button class="tab" role="tab" data-d="0"><span class="t">🗺️ 總覽</span><small>東北八日地圖</small></button>`+
 days.map((x,i)=>`<button class="tab" role="tab" data-d="${x.d}"><span class="t">${av(i%2?AV2:AV1)}Day ${x.d}</span><small>${x.date}（${x.wd}）${AREA[i]}</small></button>`).join("");
tabs.onclick=e=>{const b=e.target.closest(".tab");if(b)show(+b.dataset.d);};

let timer=null,speed=1,cur=0,STOPS=[],MP=null;
function stop(){if(timer){cancelAnimationFrame(timer.r);clearTimeout(timer.t);timer=null;}const b=document.getElementById("play");if(b)b.textContent="▶";}
function setCur(i,anim){
  const prev=cur;cur=i;const P=MP.stops;
  document.getElementById("tm").textContent=STOPS[i][0];
  document.getElementById("tx").textContent=STOPS[i][1];
  document.getElementById("sl").value=i;
  document.querySelectorAll(".it[data-i]").forEach(e=>e.classList.toggle("on",+e.dataset.i===i));
  document.querySelectorAll(".pin").forEach(g=>{const on=+g.dataset.i===i;g.querySelector("rect").setAttribute("fill",on?"var(--red)":"var(--card)");g.querySelectorAll("text")[1].setAttribute("fill",on?"#fff":"var(--ink)");});
  const w=document.getElementById("walker");const to=P[i],from=P[prev]||to;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!anim||reduce){w.setAttribute("transform",`translate(${to[0]} ${to[1]})`);return;}
  const dur=1100/speed,t0=performance.now();
  const f=now=>{const k=Math.min(1,(now-t0)/dur);const x=from[0]+(to[0]-from[0])*k,y=from[1]+(to[1]-from[1])*k-Math.sin(k*Math.PI)*10;
    w.setAttribute("transform",`translate(${x} ${y})`);if(k<1){const r=requestAnimationFrame(f);if(timer)timer.r=r;}};
  const r=requestAnimationFrame(f);if(timer)timer.r=r;}
function show(d){
  stop();
  tabs.querySelectorAll(".tab").forEach(b=>{const on=+b.dataset.d===d;b.setAttribute("aria-selected",on);if(on)b.scrollIntoView({block:"nearest",inline:"center"});});
  try{history.replaceState(null,"","#d"+d);}catch(e){}
  const main=document.getElementById("main");
  if(d===0){main.innerHTML=overview();return;}
  const x=days[d-1];MP=MAPS[d];STOPS=x.items.filter(i=>i[0]!=="t");cur=0;
  let n=-1;
  const list=x.items.map(i=>{if(i[0]==="t"){const k=(i[1].match(/新青森，轉奧羽/)?714:i[1].match(/Hayabusa → 盛岡/)?178:i[1].match(/盛岡 → 仙台/)?183:i[1].match(/山形 → 仙台/)?58:i[1].match(/松島海岸|仙石線 → 仙台/)?23:i[1].match(/八甲田纜車站|JR 巴士 → 青森站/)?30:i[1].match(/仙台 → 岩沼/)?18:i[1].match(/仙台 → 山寺/)?49:i[1].match(/山寺 → 山形/)?13:0);
      return `<li class="go">${esc(i[1])}・${esc(i[2])}${k?`<em>約 ${k} km</em>`:""}</li>`;}
    n++;const q=i[1].split(/[→（(]/)[0].trim();const nolink=/^(退房|報到|青森退房|抵達羽田|星宇)/.test(i[1]);
    return `<li class="it" data-i="${n}"><time>${i[0]}</time><div><strong>${esc(i[1])}</strong>${i[2]?`<small>${esc(i[2])}</small>`:""}${nolink?"":`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}" target="_blank" rel="noopener">📍 Google 地圖</a>`}</div></li>`;}).join("");
  main.innerHTML=`
  <section class="box head"><div class="row">${av(d%2?AV1:AV2)}<div><h2>Day ${d}：${esc(x.title)}</h2><p>2026/${x.date}（${x.wd}）・${AREA[d-1]}</p></div></div>
   <span class="cost">當日合計 ¥${COST[d-1].toLocaleString()}<small>每人預估</small></span></section>
  <section class="box mapbox">
   <svg viewBox="0 0 360 ${MP.h||320}" role="img" aria-label="第 ${d} 天手帳示意地圖">${drawMap(MP,STOPS,0)}</svg>
   <div class="now"><span class="tm" id="tm"></span><span class="tx" id="tx"></span></div>
   <div class="ctrl"><button class="play" id="play" type="button" aria-label="播放">▶</button>
     <input id="sl" type="range" min="0" max="${STOPS.length-1}" step="1" value="0" aria-label="行程進度">
     <button class="spd" id="spd" type="button">×${speed}</button></div>
   <div class="team"><span>${av(AV1)}小柏</span><span>${av(AV2)}雯莉</span></div>
   <ol>${list}</ol>
   ${x.stay?`<p class="stay">🛏️ 今晚住：${esc(x.stay)}</p>`:""}
  </section>`;
  setCur(0,false);
  document.querySelectorAll(".pin").forEach(g=>g.onclick=()=>{stop();setCur(+g.dataset.i,true);});
  document.querySelectorAll(".it[data-i]").forEach(e=>e.onclick=ev=>{if(ev.target.closest("a"))return;stop();setCur(+e.dataset.i,true);});
  document.getElementById("sl").oninput=e=>{stop();setCur(+e.target.value,true);};
  document.getElementById("spd").onclick=function(){speed=speed>=4?1:speed*2;this.textContent="×"+speed;};
  document.getElementById("play").onclick=function(){
    if(timer){stop();return;}
    if(cur>=STOPS.length-1)setCur(0,false);
    this.textContent="❚❚";timer={};
    const step=()=>{if(!timer)return;if(cur>=STOPS.length-1){stop();return;}setCur(cur+1,true);timer.t=setTimeout(step,(1100+900)/speed);};
    timer.t=setTimeout(step,300/speed);};
}
function overview(){
  const C=[["東京",200,300,"s"],["青森",190,40,"s"],["盛岡",215,125,"e"],["山形・山寺",110,245,"s"],["仙台",210,225,"e"],["松島",280,190,"s"]];
  let s=`<rect width="360" height="320" fill="var(--land)"/><path d="M0 0 H120 Q90 90 80 160 Q60 240 0 300 Z" fill="var(--water)"/><path d="M360 0 V320 H300 Q330 250 310 180 Q290 110 310 0 Z" fill="var(--water)"/>
  <text x="18" y="120" font-size="14" font-weight="900" fill="var(--muted)" opacity=".6">日本海</text><text x="318" y="100" font-size="12" font-weight="900" fill="var(--muted)" opacity=".6">太平洋</text>

   <rect x="${(A[1]+B[1])/2-26}" y="${(A[2]+B[2])/2-9}" width="52" height="17" rx="8.5" fill="var(--card)" stroke="var(--ink)" stroke-width="1.4"/><text x="${(A[1]+B[1])/2}" y="${(A[2]+B[2])/2+3}" font-size="10" font-weight="700" text-anchor="middle" fill="var(--ink)">${k} km</text>`;});
  C.forEach(([n,x,y,an])=>s+=`<circle cx="${x}" cy="${y}" r="9" fill="var(--red)" stroke="var(--ink)" stroke-width="2"/><text x="${an==="e"?x-14:x+(n==="山形・山寺"?-30:14)}" y="${n==="山形・山寺"?y+26:y+5}" font-size="14" font-weight="900" text-anchor="${an==="e"?"end":"start"}" fill="var(--ink)">${n}</text>`);
  return `<section class="box head"><div class="row">${av(AV1)}<div><h2>總覽：東北八日地圖</h2><p>東京 → 青森 2 晚 → 盛岡 1 晚 → 仙台 4 晚</p></div></div>
   <span class="cost">八日合計 ¥${COST.reduce((a,b)=>a+b,0).toLocaleString()}<small>每人預估，不含住宿機票</small></span></section>
  <section class="box mapbox"><svg viewBox="0 0 360 320" role="img" aria-label="東北八日路線示意">${s}</svg>
   <div class="team"><span>${av(AV1)}小柏</span><span>${av(AV2)}雯莉</span></div></section>
  <section class="box info"><h3>✈️ 航班</h3><div class="scroll"><table><tr><th>日期</th><th>航班</th><th>時間</th></tr>
   <tr><td>11/27</td><td>虎航 IT216 桃園 T1 → 羽田 T3</td><td>00:10 → 04:25</td></tr>
   <tr><td>12/04</td><td>星宇 JX863 仙台 → 桃園 T1</td><td>17:25 → 20:35</td></tr></table></div></section>
  <section class="box info"><h3>🏨 住宿</h3><div class="scroll"><table><tr><th>日期</th><th>飯店</th></tr>
   <tr><td>11/27–29</td><td>Daiwa Roynet Hotel Aomori</td></tr><tr><td>11/29–30</td><td>GRIDS PREMIUM HOTEL MORIOKA</td></tr><tr><td>11/30–12/04</td><td>Daiwa Roynet Sendai-nishiguchi PREMIER</td></tr></table></div></section>
  <section class="box info"><h3>🎫 票券</h3><div class="scroll"><table><tr><th>票券</th><th>價格</th><th>用在</th></tr>
   <tr><td>JR EAST PASS 5 日</td><td>¥35,000</td><td>11/27–12/01 新幹線、JR、八甲田 JR 巴士</td></tr>
   <tr><td>Suica</td><td>儲值</td><td>12/02 起的電車、地下鐵</td></tr>
   <tr><td>るーぷる仙台一日券</td><td>約 ¥900</td><td>12/03</td></tr></table></div></section>`;}

/* skins + clock */

const skinBtns=document.querySelectorAll("button[data-skin]");

const tick=()=>{document.getElementById("jst").textContent=new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());};

const h=(location.hash.match(/^#d([0-8])$/)||[])[1];
const today=(()=>{const t=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Tokyo"}));const k=Math.floor((t-new Date(2026,10,27))/864e5)+1;return k>=1&&k<=8?k:0;})();
show(h!==undefined?+h:today);
